[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']

[env]
# zerobrew LLVM clang for wasm32 C compilation (libdeflate-sys).
# Uses -I (not -isystem) to prevent macOS SDK headers from being injected.
CC_wasm32_unknown_unknown = "/opt/zerobrew/opt/llvm/bin/clang"
CFLAGS_wasm32_unknown_unknown = "--target=wasm32-unknown-unknown --no-default-config -nostdinc -I /opt/zerobrew/opt/llvm/lib/clang/23/include -ffreestanding"
