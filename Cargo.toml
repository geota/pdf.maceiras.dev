[workspace]
resolver = "2"
members = [
    "crates/pdf-core",
    "crates/pdf-wasm",
]

[workspace.dependencies]
lopdf = "0.34"
thiserror = "2"
log = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
