[workspace]
resolver = "2"
members = [
    "crates/pdf-core",
    "crates/pdf-wasm",
]

[workspace.dependencies]
lopdf = "0.39"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
justjp2 = "0.1.1"
thiserror = "2"
log = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
oxipng = { version = "10", default-features = false, features = ["freestanding"] }
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
